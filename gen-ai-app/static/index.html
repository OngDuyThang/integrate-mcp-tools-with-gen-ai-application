<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Agent AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .markdown-body ul {
        list-style-type: disc;
        margin-left: 1.5em;
      }
      .markdown-body ol {
        list-style-type: decimal;
        margin-left: 1.5em;
      }
      .typing-dot {
        animation: typing 1.4s infinite ease-in-out both;
      }
      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body
    class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col font-sans transition-colors duration-300"
  >
    <!-- Header -->
    <header
      class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 shadow-sm dark:shadow-lg flex flex-col sm:flex-row items-center justify-between gap-3 z-10 transition-colors duration-300"
    >
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="bg-blue-600 p-2 rounded-lg shadow-md">
          <i class="fas fa-robot text-white text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-gray-800 dark:text-white">
            Weather Agent
          </h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Powered by MCP Tools
          </p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex gap-2 w-full sm:w-auto">
        <!-- Model Selector -->
        <select
          id="model-select"
          class="flex-1 sm:flex-none bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white text-sm rounded-lg block p-2.5 border border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500 transition-colors"
        >
          <option value="gemini">Gemini 2.5 Flash</option>
          <option value="mistral">Mistral Large 3</option>
        </select>

        <!-- Theme Selector -->
        <div class="relative">
          <select
            id="theme-select"
            class="bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white text-sm rounded-lg block p-2.5 border border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500 transition-colors pl-8"
          >
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
          <i
            class="fas fa-adjust absolute left-3 top-3 text-gray-500 dark:text-gray-400 pointer-events-none"
          ></i>
        </div>
      </div>
    </header>

    <!-- Chat Container -->
    <main
      id="chat-container"
      class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth bg-gray-50 dark:bg-gray-900 transition-colors duration-300"
    >
      <!-- Welcome Message -->
      <div class="flex justify-start">
        <div
          class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%] sm:max-w-[75%] shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-300"
        >
          <p class="text-sm">
            Hello! I can check the weather, forecasts, and air quality using
            Gemini or Mistral. Select your preferred model and enjoy!<br />
            <span
              class="text-blue-600 dark:text-blue-400 italic font-medium mt-1 block"
              >"What is the weather in Tokyo?"</span
            >
          </p>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer
      class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 transition-colors duration-300"
    >
      <form
        id="chat-form"
        class="max-w-4xl mx-auto relative flex items-center gap-2"
      >
        <input
          type="text"
          id="user-input"
          class="w-full bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl border border-gray-300 dark:border-gray-600 px-4 py-3 pr-12 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 placeholder-gray-500 transition-all shadow-inner"
          placeholder="Ask about the weather..."
          autocomplete="off"
        />
        <button
          type="submit"
          class="absolute right-2 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
        >
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </footer>

    <script>
      // --- Theme Logic ---
      const themeSelect = document.getElementById("theme-select");
      const htmlElement = document.documentElement;

      function applyTheme(theme) {
        localStorage.setItem("theme", theme);
        if (theme === "dark") {
          htmlElement.classList.add("dark");
        } else {
          htmlElement.classList.remove("dark");
        }
      }

      // Initialize Theme (Default to Dark)
      const savedTheme = localStorage.getItem("theme") || "dark";
      themeSelect.value = savedTheme;
      applyTheme(savedTheme);

      // Listen for changes
      themeSelect.addEventListener("change", (e) => {
        applyTheme(e.target.value);
      });

      // --- Chat Logic ---
      const chatContainer = document.getElementById("chat-container");
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const modelSelect = document.getElementById("model-select");

      function addMessage(content, isUser = false, modelName = null) {
        const div = document.createElement("div");
        div.className = `flex ${isUser ? "justify-end" : "justify-start"}`;

        const bubble = document.createElement("div");
        // User: Blue bubble (same for light/dark)
        // Bot: White in Light mode, Dark Gray in Dark mode
        bubble.className = isUser
          ? "bg-blue-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] sm:max-w-[75%] shadow-md"
          : "bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%] sm:max-w-[75%] shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-300";

        if (isUser) {
          bubble.textContent = content;
        } else {
          // Content Container
          const contentDiv = document.createElement("div");
          contentDiv.className = "markdown-body";
          contentDiv.innerHTML = marked.parse(content);
          bubble.appendChild(contentDiv);

          // Model Indicator Footer
          if (modelName) {
            const modelFooter = document.createElement("div");
            modelFooter.className =
              "mt-2 pt-2 border-t border-gray-100 dark:border-gray-700 flex justify-end items-center gap-1.5 opacity-70";
            modelFooter.innerHTML = `
                        <span class="text-[10px] uppercase font-bold text-gray-500 dark:text-gray-400 tracking-wider">${modelName}</span>
                        <i class="fas fa-microchip text-[10px] text-blue-500"></i>
                    `;
            bubble.appendChild(modelFooter);
          }
        }

        div.appendChild(bubble);
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function addLoading() {
        const div = document.createElement("div");
        div.id = "loading-indicator";
        div.className = "flex justify-start";
        div.innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none px-4 py-4 shadow-sm border border-gray-200 dark:border-gray-700 flex gap-1 transition-colors duration-300">
                    <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                    <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                    <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                </div>
            `;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
      }

      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        const selectedModel = modelSelect.value;

        if (!message) return;

        addMessage(message, true);
        userInput.value = "";
        userInput.disabled = true;

        const loading = addLoading();

        try {
          const res = await fetch("/converse", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt: message,
              model_name: selectedModel,
            }),
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Server error");
          }

          const data = await res.json();

          loading.remove();
          // Pass the model_used to the addMessage function
          addMessage(data.response, false, data.model_used);
        } catch (error) {
          loading.remove();
          addMessage(`⚠️ Error: ${error.message}`, false);
        } finally {
          userInput.disabled = false;
          userInput.focus();
        }
      });
    </script>
  </body>
</html>
